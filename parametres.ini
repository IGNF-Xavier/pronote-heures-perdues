; ============================================================
;  Paramètres de pronote_suivi  (fichier texte, à éditer à la main)
;  Lignes commençant par ; ou # = commentaires.
;  Dates au format JJ/MM/AAAA (ex. 31/08/2026).
; ============================================================
[pronote]

; Les dates ci-dessous sont les valeurs PROPOSÉES au lancement : l'outil vous les
; demande et il suffit d'appuyer sur Entrée pour les accepter.

; --- L'ESSENTIEL --------------------------------------------
; Adresse Pronote de votre établissement. Si elle se termine par /pronote/,
; "parent.html" est ajouté automatiquement (espace Parents).
; Vide : l'outil vous la demande au lancement et l'enregistre ici.
url =

; Date de la rentrée (n'importe quel jour de la semaine de rentrée)
rentree = 31/08/2026

; --- FACULTATIFS --------------------------------------------
; Dernière semaine à analyser (n'importe quel jour de cette semaine).
; Laisser vide = semaine en cours (date du jour).
semaine = 

; Dossier de résultats (captures, données, Excel). Relatif au dossier du script.
dossier = sortie

; Navigateur : msedge ou chrome. Vide = essaie Edge puis Chrome.
navigateur = 

; Attente (millisecondes) après chaque changement de semaine. Augmentez si Pronote est lent.
attente_ms = 1500

; Un rattrapage (cours déplacé/modifié) est relié à une heure perdue de la même matière
; située à +/- ce nombre de jours.
fenetre_jours = 14

; Matières affichées dans l'Excel mais EXCLUES des totaux (synthèse, par semaine, TOTAL par matière).
; Séparer par des points-virgules ; vide = aucune exclusion. (Créneau bloqué peu utilisé.)
matieres_exclues = VIE DE CLASSE

; --- DÉCLARATION FCPE (onglet « Saisie FCPE » de l'Excel) -----
; Les trois champs du formulaire Ouyapacours ; vides, vous les complétez dans Excel.
; Exemple de classe : 4ème
ville =
etablissement =
classe =
; Motifs de cours non assurés à déclarer (séparés par des points-virgules). Défaut : Prof absent
; Possibles : Prof absent ; Annulé ; Grève ; Dispensé ; Absence élève
motifs_fcpe = Prof absent
; matiere = une déclaration par matière (dates ajoutées les unes sous les autres)
; periode = une nouvelle déclaration à chaque nouvelle absence après reprise des cours
regroupement_fcpe = matiere

; --- DÉPANNAGE (laisser vide en temps normal) ----------------
; oui = vous changez de semaine vous-même dans le navigateur (puis Entrée)
mode_manuel = non
; Sélecteur CSS des blocs de cours, si 0 cours sont détectés (voir le mode d'emploi)
selecteur_cours = 
; Sélecteur CSS du bouton "semaine suivante" (mode sans bande des semaines)
selecteur_suivant = 
